spring.application.name=management-system

server.port=8080


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/complaint_management_db?useSSL=false&serverTimezone=Asia/Kolkata
spring.datasource.username=root
