spring.application.name=management-system

server.port=${PORT:8080}

# =========================================================
# DATABASE - POSTGRESQL
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/complaint_management_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# =========================================================
# FRONTEND
# =========================================================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.com.complaint.system=INFO

# =========================================================
# MAIL DEBUG
# =========================================================

spring.mail.properties.mail.debug=false
logging.level.org.eclipse.angus.mail=INFO
logging.level.org.eclipse.angus.mail.smtp=INFO