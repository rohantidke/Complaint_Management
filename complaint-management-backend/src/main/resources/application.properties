spring.application.name=management-system

server.port=${PORT:8080}

# =========================================================
# DATABASE - SUPABASE POSTGRESQL / ENVIRONMENT OVERRIDES
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require&stringtype=unspecified&connectTimeout=10&socketTimeout=30}
spring.datasource.username=${DB_USERNAME:postgres.xzijvwuggifenmwfyazv}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Settings
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:YourSuperSecretKeyForComplaintManagementSystem2026VerySecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# =========================================================
# FRONTEND
# =========================================================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.com.complaint.system=INFO

# =========================================================
# MAIL DEBUG
# =========================================================

spring.mail.properties.mail.debug=false
logging.level.org.eclipse.angus.mail=INFO
logging.level.org.eclipse.angus.mail.smtp=INFO

# =========================================================
# SUPABASE API & INTEGRATION CREDENTIALS
# =========================================================

supabase.url=${SUPABASE_URL:https://xzijvwuggifenmwfyazv.supabase.co}
