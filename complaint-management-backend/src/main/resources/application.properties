spring.application.name=management-system

server.port=8080

# =========================================================

# DATABASE

# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/complaint_management_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# =========================================================

# JPA / HIBERNATE

# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================

# FILE UPLOAD

# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# =========================================================

# JWT

# =========================================================

jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET}
jwt.expiration=86400000

# =========================================================

# ACTUATOR

# =========================================================

management.endpoints.web.exposure.include=health,info

# =========================================================

# GMAIL SMTP

# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

# =========================================================

# LOGGING

# =========================================================

logging.level.org.springframework.security=DEBUG
logging.level.com.complaint.system=DEBUG

# Mail debugging - disable for production

logging.level.org.eclipse.angus.mail=INFO
logging.level.org.eclipse.angus.mail.smtp=INFO
spring.mail.properties.mail.debug=false
